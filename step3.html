<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그림 터치 문진표 - 얼마나 아파요?</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .pain-scale-wrap {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .pain-label {
      text-align: center;
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: var(--text-sub);
    }
    .pain-label span { font-weight: 700; color: var(--text-main); }
  </style>
</head>
<body>
  <header>
    <button class="btn btn-secondary" onclick="window.location.href='step2.html'">
      <span class="icon">◀</span> <span class="text" data-i18n="btn_prev">이전</span>
    </button>
    <div id="progress-bar"><div id="progress-fill" style="width: 60%;"></div><span id="progress-text">3 / 5</span></div>
    <button id="btn-nurse-lock" class="btn-icon">🔒</button>
  </header>

  <section class="step active">
    <h1 class="speakable"><span data-i18n="step_3_title">얼마나 아파요?</span><button class="btn-speaker">🔊</button></h1>
    <div class="pain-scale-wrap" id="pain-list-container">
      <!-- Dynamically filled by JS -->
    </div>
    
    <div class="step-actions" style="margin-top: 1rem; text-align: center;">
      <button id="btn-next" class="btn btn-primary" data-i18n="btn_next" disabled>다음</button>
    </div>
  </section>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let state = getState();
      const cur = state.current;
      if (!cur) { window.location.href = 'step1.html'; return; }
      // 기기 뒤로 가기로 온 경우: 남은 부위가 있으면 증상 선택, 이번 회차를 다 끝냈으면 step4로 (끝낸 기록이 버려지지 않게)
      if (!cur.partObj || !cur.queue) { window.location.href = (cur.queue && cur.queue.length) ? 'step2.html' : (cur.done.length ? 'step4.html' : 'step1.html'); return; }
      // 고른 증상이 없으면 증상 선택으로
      if (cur.symptoms.length === 0) { window.location.href = 'step2.html'; return; }

      const container = document.getElementById('pain-list-container');
      const btnNext = document.getElementById('btn-next');

      function checkCompletion() {
        btnNext.disabled = !cur.symptoms.every(s => cur.painLevels[s] !== undefined);
      }

      cur.symptoms.forEach(symptom => {
        const translatedSymptom = escapeHtml(translateKoToLang(symptom, state.lang));
        const block = document.createElement('div');
        block.className = 'symptom-pain-block';
        block.style.marginBottom = '2rem';
        block.style.width = '100%';
        block.innerHTML = `
          <h3 style="text-align: center; color: var(--primary); margin-bottom: 1rem;">${translatedSymptom}</h3>
          <div class="faces-container" data-symptom="${escapeHtml(symptom)}">
            <button class="face-btn" data-pain="0"><div class="emoji">😄</div><div class="label">0</div></button>
            <button class="face-btn" data-pain="2"><div class="emoji">🙂</div><div class="label">2</div></button>
            <button class="face-btn" data-pain="4"><div class="emoji">😐</div><div class="label">4</div></button>
            <button class="face-btn" data-pain="6"><div class="emoji">☹️</div><div class="label">6</div></button>
            <button class="face-btn" data-pain="8"><div class="emoji">😣</div><div class="label">8</div></button>
            <button class="face-btn" data-pain="10"><div class="emoji">😭</div><div class="label">10</div></button>
          </div>
          <div class="pain-label">
            <span>😄 ${translations[state.lang].pain_min || translations.ko.pain_min}</span> ← → <span>😭 ${translations[state.lang].pain_max || translations.ko.pain_max}</span>
          </div>
        `;
        container.appendChild(block);
        
        // Restore state if exists
        if (cur.painLevels[symptom] !== undefined) {
          const faceBtn = block.querySelector(`.face-btn[data-pain="${cur.painLevels[symptom]}"]`);
          if (faceBtn) faceBtn.classList.add('selected');
        }
      });
      
      checkCompletion();

      document.querySelectorAll('.faces-container').forEach(fc => {
        const symptom = fc.dataset.symptom;
        fc.querySelectorAll('.face-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            fc.querySelectorAll('.face-btn').forEach(b => b.classList.remove('selected'));
            e.currentTarget.classList.add('selected');
            cur.painLevels[symptom] = e.currentTarget.dataset.pain;
            saveState(state);
            checkCompletion();
          });
        });
      });
      
      applyLanguageToUI();

      btnNext.addEventListener('click', () => {
        // 두 번 눌러 빈 기록이 추가되지 않도록 한 번만 처리
        if (btnNext.disabled || !cur.partObj) return;
        btnNext.disabled = true;

        // 이번 회차에서 끝낸 기록에 추가 (언제부터·다친 원인은 step4에서 채움)
        cur.done.push({
            partObj: cur.partObj,
            symptoms: [...cur.symptoms],
            // 지금 선택된 증상의 통증만 저장 (해제한 증상의 통증이 남지 않게)
            painLevels: Object.fromEntries(cur.symptoms.map(s => [s, cur.painLevels[s]])),
            headQ: cur.headQ,
            startTimes: {},
            traumaCauses: {}
        });

        // Remove completed part from queue
        cur.queue.shift();

        // Clear temp state for next part
        cur.partObj = null;
        cur.symptoms = [];
        cur.painLevels = {};
        cur.headQ = null;

        saveState(state);

        // Loop back to step2 if more parts, otherwise go to step4
        if (cur.queue.length > 0) {
            window.location.href = 'step2.html';
        } else {
            window.location.href = 'step4.html';
        }
      });
    });
  </script>
</body>
</html>
