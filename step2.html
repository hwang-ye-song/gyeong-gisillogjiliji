<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그림 터치 문진표 - 어떻게 아파요?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <button id="btn-back" class="btn btn-secondary">
      <span class="icon">◀</span> <span class="text" data-i18n="btn_prev">이전</span>
    </button>
    <div id="progress-bar"><div id="progress-fill" style="width: 40%;"></div><span id="progress-text">2 / 5</span></div>
    <button id="btn-nurse-lock" class="btn-icon">🔒</button>
  </header>

  <section class="step active">
    <h1 class="speakable"><span id="title-span" data-i18n="step_2_title">어떻게 아파요?</span><button class="btn-speaker">🔊</button></h1>
    <div id="selected-part-display" style="text-align: center; color: var(--primary); font-weight: bold; margin-bottom: 1.5rem; font-size: 1.1rem; background: rgba(99,102,241,0.1); padding: 0.5rem 1rem; border-radius: 8px; width: fit-content; margin-left: auto; margin-right: auto;"></div>
    
    <!-- 머리를 다친 경우 추가 질문 -->
    <div id="head-q-flow" class="hidden hurt-flow">
      <div class="symptoms-grid single-select">
        <button class="symptom-card" data-headq="yes"><span class="emoji">⭕</span><span class="text" data-i18n="yes">네</span></button>
        <button class="symptom-card" data-headq="no"><span class="emoji">❌</span><span class="text" data-i18n="no">아니요</span></button>
        <button class="symptom-card btn-idk-card"><span class="emoji">❓</span><span class="text" data-i18n="idk">잘 모르겠어요</span></button>
      </div>
    </div>

    <!-- Normal Symptoms Grid -->
    <div id="symptoms-container" class="symptoms-grid hidden"></div>

    <div class="step-actions">
      <button id="btn-next" class="btn btn-primary" data-i18n="btn_next" disabled>다음</button>
    </div>
  </section>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let state = getState();
      const cur = state.current;
      if (!cur) { window.location.href = 'step1.html'; return; }

      // 배·팔 묶음이 없으면 고른 부위 하나로 대기열을 만듦
      if (!cur.queue || cur.queue.length === 0) {
          cur.queue = [{ id: 'single', name: cur.part, lookupPart: cur.part }];
      }
      cur.partObj = cur.queue[0];

      function updateTitle(i18nKey) {
        const span = document.getElementById('title-span');
        span.setAttribute('data-i18n', i18nKey);
        applyLanguageToUI();
      }

      const showFlow = (id) => {
        document.querySelectorAll('.hurt-flow, #symptoms-container').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
      };

      renderSymptoms();

      function renderSymptoms() {
        updateTitle('step_2_title');

        const partDisplay = document.getElementById('selected-part-display');

        // 몇 번째 부위인지 표시 (앞에서 끝낸 기록 + 남은 대기열)
        const doneCount = allEntries(state).length;
        const total = doneCount + cur.queue.length;
        const currentIdx = doneCount + 1;

        let displayStr = cur.partObj.name;
        // Translate belly parts if needed
        const t = translations[state.lang] || translations['ko'];
        if (t[displayStr]) displayStr = t[displayStr];
        else if (t[cur.partObj.id]) displayStr = t[cur.partObj.id];
        
        if (total > 1) {
             partDisplay.innerText = `📍 ${t['pain_1'] ? t['pain_1'].replace('1', currentIdx) : '통증 ' + currentIdx}: ${displayStr}`;
        } else {
             partDisplay.innerText = `📍 ${t['summary_part'] || '선택한 부위'}: ${displayStr}`;
        }
        
        showFlow('symptoms-container');
        const container = document.getElementById('symptoms-container');
        container.innerHTML = '';
        
        let lookupPart = cur.partObj.lookupPart;
        if (lookupPart.includes(' (')) {
            const base = lookupPart.split(' (')[0];
            const detail = lookupPart.split(' (')[1].replace(')', '');
            const subParts = ['어깨·윗팔', '팔꿈치·아랫팔', '손·손목', '허벅지', '무릎', '종아리·발목', '발'];
            const found = subParts.find(sp => detail.includes(sp));
            lookupPart = found && symptomsData[found] ? found : base;
        }
        
        let symptomsList = symptomsData[lookupPart] || [];
        symptomsList.forEach(s => {
          const btn = document.createElement('button');
          btn.className = 'symptom-card multi-select ' + (cur.symptoms.includes(s.ko) ? 'selected' : '');
          btn.innerHTML = `<span class="emoji">${escapeHtml(s.icon)}</span><span class="text">${escapeHtml(s[state.lang] || s.ko)}</span>`;
          btn.onclick = () => {
            if (cur.symptoms.includes(s.ko)) {
              cur.symptoms = cur.symptoms.filter(sym => sym !== s.ko);
              btn.classList.remove('selected');
            } else {
              cur.symptoms.push(s.ko);
              btn.classList.add('selected');
            }
            saveState(state);
            document.getElementById('btn-next').disabled = cur.symptoms.length === 0;
          };
          container.appendChild(btn);
        });

        // Add IDK card
        const idkBtn = document.createElement('button');
        idkBtn.className = 'symptom-card btn-idk-card';
        idkBtn.innerHTML = `<span class="emoji">❓</span><span class="text">${escapeHtml(t.idk || translations.ko.idk)}</span>`;
        idkBtn.onclick = () => {
            cur.symptoms = [translations.ko.idk];
            cur.headQ = null;
            saveState(state);
            window.location.href = 'step3.html';
        };
        container.appendChild(idkBtn);

        document.getElementById('btn-next').disabled = cur.symptoms.length === 0;
        document.getElementById('btn-next').onclick = () => {
          if (cur.partObj.lookupPart === '머리' && cur.symptoms.some(s => s === '머리를 다쳤어요' || s === '부딪혔어요')) {
            updateTitle('head_q');
            showFlow('head-q-flow');
          } else {
            // 머리 질문을 안 한 경우 전에 고른 답이 남지 않게
            cur.headQ = null;
            saveState(state);
            window.location.href = 'step3.html';
          }
        };

        // Head Q Flow (네: true, 아니요: false, 잘 모르겠어요: null)
        document.querySelectorAll('[data-headq]').forEach(btn => {
          btn.onclick = (e) => {
            cur.headQ = e.currentTarget.dataset.headq === 'yes' ? true : false;
            saveState(state);
            window.location.href = 'step3.html';
          };
        });
        document.querySelector('#head-q-flow .btn-idk-card').onclick = () => {
          cur.headQ = null;
          saveState(state);
          window.location.href = 'step3.html';
        };
      }

      // Back Button
      document.getElementById('btn-back').addEventListener('click', () => {
        if (!document.getElementById('head-q-flow').classList.contains('hidden')) {
          showFlow('symptoms-container');
          updateTitle('step_2_title');
          return;
        }
        // 부위를 다시 고르도록 이번 회차 대기열·답을 비움 (배·팔 두 번째 묶음이면 먼저 끝낸 기록도 버림)
        restartRound(cur);
        let back = 'step1.html';
        if (cur.sub.side) {
          back = 'step1_sub.html';
        } else if (cur.sub.headSub) {
          cur.sub.headSub = false;
          cur.part = translations.ko['part_head'];
          back = 'step1_sub.html';
        } else if (cur.part === translations.ko['part_belly'] || cur.part === translations.ko['part_arm']) {
          // 배·팔은 구역 선택 화면으로
          back = cur.part === translations.ko['part_arm'] ? 'step1_arm.html' : 'step1_sub.html';
        }
        saveState(state);
        window.location.href = back;
      });

      applyLanguageToUI();
    });
  </script>
</body>
</html>
