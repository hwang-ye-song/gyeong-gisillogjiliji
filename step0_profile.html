<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 정보 입력</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .profile-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      gap: 1.5rem;
    }
    .profile-form {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.5px solid var(--secondary);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-weight: bold;
      color: var(--text-main);
      font-size: 1.1rem;
    }
    .form-group input {
      padding: 0.75rem;
      border: 2px solid var(--secondary);
      border-radius: var(--radius);
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: var(--primary);
    }
    .form-group input.invalid {
      border-color: var(--emergency);
      background-color: #FEF2F2;
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <header>
    <button class="btn btn-secondary" onclick="window.location.href='index.html'">
      <span class="icon">◀</span> <span class="text" data-i18n="btn_prev">이전</span>
    </button>
    <div id="progress-bar"><div id="progress-fill" style="width: 5%;"></div><span id="progress-text"></span></div>
    <button id="btn-nurse-lock" class="btn-icon">🔒</button>
  </header>

  <section class="step active">
    <div class="profile-container">
      <h1 class="speakable"><span data-i18n="profile_title">내 정보 입력</span><button class="btn-speaker">🔊</button></h1>
      <div class="profile-form">
        <div class="form-group">
          <label data-i18n="profile_grade">학년</label>
          <input type="number" id="input-grade" min="1" inputmode="numeric" pattern="[0-9]*" data-i18n-placeholder="profile_placeholder">
        </div>
        <div class="form-group">
          <label data-i18n="profile_class">반</label>
          <input type="number" id="input-class" min="1" inputmode="numeric" pattern="[0-9]*" data-i18n-placeholder="profile_placeholder">
        </div>
        <div class="form-group">
          <label data-i18n="profile_number">번호</label>
          <input type="number" id="input-number" min="1" inputmode="numeric" pattern="[0-9]*" data-i18n-placeholder="profile_placeholder">
        </div>
      </div>
    </div>
  </section>

  <nav class="bottom-nav">
    <button class="btn btn-primary btn-large" id="btn-next">
      <span class="text" data-i18n="profile_next">다음으로</span> <span class="icon">▶</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script src="data.js"></script>
  <script src="db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Placeholder localization
      const state = getState();
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (translations[state.lang] && translations[state.lang][key]) {
              el.setAttribute('placeholder', translations[state.lang][key]);
          }
      });

      // Restore values if previously entered
      if (state.visit.grade) document.getElementById('input-grade').value = state.visit.grade;
      if (state.visit.class_num) document.getElementById('input-class').value = state.visit.class_num;
      if (state.visit.student_num) document.getElementById('input-number').value = state.visit.student_num;

      // 입력하면 빨간 표시 해제
      document.querySelectorAll('.form-group input').forEach(input => {
        input.addEventListener('input', () => input.classList.remove('invalid'));
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        // 비었거나 1 이상 정수가 아닌 칸은 빨갛게 표시 (언어와 상관없이 알아볼 수 있게 글 대신 색으로)
        const inputs = ['input-grade', 'input-class', 'input-number'].map(id => document.getElementById(id));
        const invalid = inputs.filter(input => {
          const v = Number(input.value);
          return input.value.trim() === '' || !Number.isInteger(v) || v < 1;
        });
        inputs.forEach(input => input.classList.toggle('invalid', invalid.includes(input)));
        if (invalid.length > 0) {
          invalid[0].focus();
          return;
        }

        let state = getState();
        state.visit.grade = document.getElementById('input-grade').value;
        state.visit.class_num = document.getElementById('input-class').value;
        state.visit.student_num = document.getElementById('input-number').value;

        saveState(state);
        window.location.href = 'step1.html';
      });
    });
  </script>
</body>
</html>
